<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stavitelé mostu</title>
<meta name="description" content="Výuková aplikace pro 4. ročník: písemné násobení a dělení do 10 000. Mgr. Helena Gřivová (vytvořeno pomocí AI).">
<style>
:root{
  --navy:#0A1B30; --navy2:#10294A; --blue:#173B66; --line:rgba(190,220,255,.10);
  --paper:#F7F2E7; --paper2:#EFE7D6; --ink:#14243C; --muted:#5B6B80;
  --gold:#E3A63A; --gold2:#F5CD7A; --gold3:#B9802A;
  --ok:#2F9A6A; --okbg:#E3F3EA; --hint:#C2662F; --hintbg:#FBEBDD;
  --cw:2.55em; --fs:19px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Verdana,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--paper);
  background:radial-gradient(1200px 600px at 70% -10%,#1B4473 0%,transparent 60%),linear-gradient(180deg,var(--navy2),var(--navy) 70%);
  background-color:var(--navy);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.35));}
button{font:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 40px;position:relative}

/* Hlavička */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:46px;height:46px;flex:none}
.logo h1{font-family:var(--serif);font-weight:600;font-size:1.6rem;margin:0;letter-spacing:.02em;
  background:linear-gradient(90deg,var(--gold2),var(--gold) 60%,#fff2cf);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:2px 0 0;font-size:.74rem;color:#B9C8DC;letter-spacing:.06em;text-transform:uppercase}
.ovladani{display:flex;gap:8px;align-items:center}
.btn-ghost{min-height:44px;min-width:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(245,205,122,.35);
  background:rgba(255,255,255,.04);color:var(--paper);font-size:.8rem;transition:background .2s,border-color .2s}
.btn-ghost:hover{background:rgba(245,205,122,.12);border-color:var(--gold)}
.hrac{font-size:.8rem;color:#C9D6E8;padding:0 6px}
.hrac b{color:var(--gold2);font-weight:600}

/* Scéna */
.scena-box{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(245,205,122,.28);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04);transition:height .7s ease}
.scena-box svg{display:block;width:100%;height:100%}
body.rezim-hub .scena-box, body.rezim-intro .scena-box{height:clamp(260px,46vw,500px)}
body.rezim-mise .scena-box{height:clamp(150px,20vw,210px)}
body.rezim-mise .scena-box svg{height:auto;position:absolute;left:0;right:0;top:50%;transform:translateY(-40%)}
.scena-stav{position:absolute;left:16px;bottom:12px;display:flex;align-items:center;gap:10px;
  background:rgba(10,27,48,.72);backdrop-filter:blur(6px);border:1px solid rgba(245,205,122,.3);padding:6px 12px;border-radius:999px;font-size:.72rem;color:#DCE6F3}
.scena-stav .bar{width:110px;height:6px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.scena-stav .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:9px;transition:width 1s ease}

/* SVG animace */
.vlna{animation:vlny 14s linear infinite}
.vlna2{animation:vlny 22s linear infinite reverse;opacity:.55}
@keyframes vlny{to{transform:translateX(-600px)}}
.mrak{animation:mraky linear infinite}
@keyframes mraky{from{transform:translateX(-260px)}to{transform:translateX(1460px)}}
.hvezda{animation:trpyt 3.5s ease-in-out infinite}
@keyframes trpyt{50%{opacity:.25}}
.lodka{animation:lodka 46s linear infinite}
@keyframes lodka{from{transform:translateX(-140px)}to{transform:translateX(1340px)}}
.houpani{animation:houpani 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes houpani{50%{transform:translateY(3px) rotate(1.5deg)}}
.prapor{animation:prapor 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes prapor{50%{transform:skewY(8deg) scaleX(.9)}}
.hak{animation:hak 4s ease-in-out infinite;transform-origin:0 0}
@keyframes hak{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.auto1{animation:jizda 9s linear infinite}
.auto2{animation:jizda2 11s linear infinite;animation-delay:-4s}
@keyframes jizda{from{transform:translateX(230px)}to{transform:translateX(960px)}}
@keyframes jizda2{from{transform:translateX(960px) scaleX(-1)}to{transform:translateX(230px) scaleX(-1)}}
.lampa{animation:lampa 2.6s ease-in-out infinite}
@keyframes lampa{50%{opacity:.55}}
.ohnostroj circle{transform-box:fill-box;transform-origin:center;animation:ohen 3.2s ease-out infinite;opacity:0}
@keyframes ohen{0%{transform:scale(.1);opacity:0}10%{opacity:1}70%{opacity:.9}100%{transform:scale(1.6);opacity:0}}

.stg{opacity:0;transition:opacity .9s ease;pointer-events:none}
.stg.on{opacity:1}
.stg.novy .rust{animation:rust 1.8s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes rust{from{transform:scaleY(0)}}
.stg.novy .kresli{stroke-dasharray:1800;animation:kresli 2.4s ease both}
@keyframes kresli{from{stroke-dashoffset:1800}to{stroke-dashoffset:0}}
.stg.novy .zleva{animation:zleva 1.8s cubic-bezier(.2,.8,.2,1) both}
.stg.novy .zprava{animation:zprava 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes zleva{from{transform:translateX(-520px);opacity:0}}
@keyframes zprava{from{transform:translateX(520px);opacity:0}}
.stg.novy .shora{animation:shora 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes shora{from{transform:translateY(-260px);opacity:0}}
#nebeH,#nebeD{transition:stop-color 2s ease}

/* Obrazovky */
.obrazovka{display:none;animation:objev .5s ease both}
.obrazovka.aktivni{display:block}
@keyframes objev{from{opacity:0;transform:translateY(12px)}}
.karta{background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);border-radius:20px;
  box-shadow:0 24px 50px -18px rgba(0,0,0,.55),0 0 0 1px rgba(185,128,42,.25);position:relative}
.karta::before{content:"";position:absolute;inset:8px;border:1px solid rgba(185,128,42,.28);border-radius:14px;pointer-events:none}

/* Úvod */
.uvod{max-width:720px;margin:-60px auto 0;padding:34px 34px 30px;position:relative;z-index:2}
.uvod h2,.mise-hlava h2,.modal h2{font-family:var(--serif);font-weight:600;margin:0 0 10px;color:var(--ink)}
.uvod h2{font-size:1.65rem}
.uvod p{line-height:1.6;margin:0 0 14px}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold3);font-weight:700;margin-bottom:6px}
.pole-jmeno{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.pole-jmeno input{flex:1 1 240px;min-height:52px;font:inherit;font-size:1.05rem;padding:0 16px;border-radius:14px;border:2px solid #CDBF9F;background:#fffdf8;color:var(--ink)}
.pole-jmeno input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,166,58,.25)}
.btn-zlato{min-height:52px;padding:0 24px;border:0;border-radius:14px;font-weight:700;color:#2A1A04;letter-spacing:.01em;
  background:linear-gradient(180deg,#FBD991,var(--gold) 55%,#C98A27);box-shadow:0 8px 18px -8px rgba(201,138,39,.9),inset 0 1px 0 rgba(255,255,255,.6);
  transition:transform .15s,box-shadow .2s,filter .2s}
.btn-zlato:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn-zlato:active{transform:translateY(0)}
.btn-zlato:disabled{opacity:.45;cursor:default;transform:none}
.btn-modra{min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;border:2px solid var(--blue);background:transparent;color:var(--blue)}
.btn-modra:hover{background:rgba(23,59,102,.08)}
.podpis{margin-top:22px;font-size:.72rem;color:var(--muted);text-align:right;font-style:italic}

/* Hub */
.hub-titul{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 2px 14px;flex-wrap:wrap}
.hub-titul h2{font-family:var(--serif);font-weight:600;margin:0;font-size:1.35rem;color:#fff}
.hub-titul p{margin:0;color:#B9C8DC;font-size:.82rem}
.mise-mrizka{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mise-karta{text-align:left;border:0;padding:20px 20px 18px;min-height:150px;display:flex;flex-direction:column;gap:6px;
  transition:transform .25s ease,box-shadow .25s ease}
.mise-karta:not(:disabled):hover{transform:translateY(-5px);box-shadow:0 30px 50px -18px rgba(0,0,0,.6),0 0 0 2px var(--gold)}
.mise-karta:disabled{cursor:default;filter:saturate(.3);opacity:.55}
.mise-karta .cislo{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-family:var(--serif);font-weight:700;
  background:linear-gradient(180deg,#FBD991,var(--gold));color:#2A1A04;box-shadow:0 4px 10px -4px rgba(201,138,39,.9)}
.mise-karta .radek{display:flex;align-items:center;justify-content:space-between}
.mise-karta h3{margin:6px 0 0;font-family:var(--serif);font-size:1.1rem;color:var(--ink)}
.mise-karta .ucivo{font-size:.8rem;color:var(--muted);line-height:1.4}
.stitek{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.stitek.hotovo{background:var(--okbg);color:var(--ok)}
.stitek.nove{background:#FFF1D2;color:var(--gold3)}
.stitek.zamceno{background:#E7E3DA;color:#7C7A72}
.mise-karta .hvezdy{font-size:.85rem;color:var(--gold3);letter-spacing:2px;margin-top:auto}
.mise-karta.kolaudace{background:linear-gradient(135deg,#1C477A,#0F2B4D);color:#fff}
.mise-karta.kolaudace::before{border-color:rgba(245,205,122,.45)}
.mise-karta.kolaudace h3{color:var(--gold2)}
.mise-karta.kolaudace .ucivo{color:#C9D6E8}
.diplom-tlacitko{display:none;margin:22px auto 0}
.diplom-tlacitko.on{display:flex}

/* Mise */
.mise-panel{margin-top:-28px;position:relative;z-index:2;padding:26px 28px 26px}
.mise-hlava{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.mise-hlava h2{font-size:1.35rem;margin:0}
.cihly{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0 4px}
.cihly i{width:30px;height:14px;border-radius:3px;background:#DDD3BF;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);transition:background .4s,transform .4s}
.cihly i.hotova{background:linear-gradient(180deg,#F2C46B,#D3922F);transform:translateY(-2px)}
.cihly i.hotova.bez{background:linear-gradient(180deg,#F7D27F,#E3A63A);box-shadow:0 0 0 2px rgba(47,154,106,.5)}
.cihly i.ted{background:var(--blue)}
.uloha-cislo{font-size:.75rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:14px}
.kontext{font-size:1.05rem;line-height:1.55;margin:6px 0 16px;max-width:760px}
.prace{display:flex;justify-content:center;padding:18px 8px 10px;overflow-x:auto}
.zpetna{min-height:56px;margin:10px 0 4px;border-radius:14px;padding:12px 16px;line-height:1.5;display:none;font-size:.95rem}
.zpetna.on{display:block;animation:objev .35s ease both}
.zpetna.ok{background:var(--okbg);color:#1E6B48;border-left:5px solid var(--ok)}
.zpetna.rada{background:var(--hintbg);color:#7A3B14;border-left:5px solid var(--hint)}
.zpetna.info{background:#E6EEF8;color:#1C3B63;border-left:5px solid var(--blue)}
.zpetna b{font-weight:700}
.akce{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;flex-wrap:wrap}

/* Počítání pod sebou */
.sloupek{font-family:var(--mono);font-size:1.5rem;display:inline-flex;flex-direction:column;gap:4px;padding:14px 18px;border-radius:16px;
  background:repeating-linear-gradient(0deg,transparent 0 calc(var(--cw) - 1px),rgba(23,59,102,.09) calc(var(--cw) - 1px) var(--cw)),
             repeating-linear-gradient(90deg,transparent 0 calc(var(--cw) - 1px),rgba(23,59,102,.09) calc(var(--cw) - 1px) var(--cw)),#FFFDF8;
  border:1px solid #DCCFB2}
.rad{display:flex}
.bunka{width:var(--cw);height:var(--cw);display:grid;place-items:center;color:var(--ink);position:relative}
.bunka.mala{height:1.55em;font-size:.62em;color:var(--gold3)}
.pozn-pamet{font-family:var(--sans);font-size:.55rem;color:var(--gold3);margin:0 0 -2px;text-align:right;padding-right:4px;letter-spacing:.04em}
.cara{border-top:3px solid var(--ink);margin:2px 0}
input.cif{width:calc(var(--cw) - 8px);height:calc(var(--cw) - 8px);text-align:center;font:inherit;font-weight:700;color:var(--blue);
  border:2px solid #B8C7DA;border-radius:10px;background:#fff;padding:0;transition:border-color .2s,box-shadow .2s,background .3s}
input.cif:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,166,58,.28)}
input.cif.pamet{width:1.5em;height:1.5em;font-size:1em;border-width:1.5px;border-style:dashed;border-color:#DDB46A;color:var(--gold3);border-radius:7px}
input.cif.spatne{border-color:var(--hint);background:var(--hintbg)}
input.cif.dobre{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
input.cif.odhaleno{border-color:var(--blue);background:#E6EEF8}
.bunka.zvyrazni{background:rgba(227,166,58,.22);border-radius:8px}
.bunka.pouzito::after{content:"";position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.bunka.nova{color:var(--gold3);font-weight:700}
.rad.dalsi{animation:dolu .6s ease both}
@keyframes dolu{from{opacity:0;transform:translateY(-14px)}}
.del-obal{display:flex;align-items:flex-start;gap:0}
.del-prava{display:flex;align-items:center;height:var(--cw);white-space:nowrap}
.del-prava .zn{padding:0 .3em}
.zb{font-family:var(--sans);font-size:.6em;color:var(--muted);padding-left:.5em}
.krok-otazka{text-align:center;font-size:1.05rem;margin:8px 0 0;color:var(--ink);min-height:1.6em}
.krok-otazka b{color:var(--blue)}
.denik{list-style:none;padding:0;margin:10px auto 0;max-width:560px;font-size:.88rem;color:var(--muted)}
.denik li{padding:3px 0;border-bottom:1px dashed #E0D5BE;animation:objev .4s ease both}
.zkouska{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px;font-size:1.2rem;font-family:var(--mono)}
.zkouska .stit{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--gold3);text-transform:uppercase;letter-spacing:.08em}
input.cislo{width:7.2em;min-height:52px;font:inherit;font-weight:700;text-align:center;border:2px solid #B8C7DA;border-radius:12px;color:var(--blue);background:#fff}
input.cislo:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(227,166,58,.28)}
input.cislo.spatne{border-color:var(--hint);background:var(--hintbg)}
input.cislo.dobre{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.priklad-velky{font-family:var(--mono);font-size:1.6rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;color:var(--ink)}
.priklad-velky input.cislo{width:4.2em}
.jednotka{font-family:var(--sans);font-size:1rem;color:var(--muted)}

/* Volby */
.volby{display:grid;gap:12px;width:100%;max-width:640px}
.volba{min-height:58px;text-align:left;padding:12px 18px;border-radius:14px;border:2px solid #D2C5A8;background:#FFFDF8;color:var(--ink);font-size:1rem;line-height:1.4;
  transition:border-color .2s,transform .15s,background .3s}
.volba:hover:not(:disabled){border-color:var(--gold);transform:translateX(4px)}
.volba.spatne{border-color:var(--hint);background:var(--hintbg);opacity:.7}
.volba.dobre{border-color:var(--ok);background:var(--okbg);color:#1E6B48;font-weight:600}
.volba:disabled{cursor:default}

/* Modální okno */
.zavoj{position:fixed;inset:0;background:rgba(5,14,26,.72);backdrop-filter:blur(5px);display:none;place-items:center;z-index:50;padding:16px}
.zavoj.on{display:grid;animation:objev .35s ease both}
.modal{max-width:560px;width:100%;padding:34px 30px 28px;text-align:center}
.modal h2{font-size:1.6rem}
.modal p{line-height:1.6;margin:0 0 14px}
.medaile{width:110px;height:110px;margin:0 auto 10px;animation:medaile 1.1s cubic-bezier(.2,1.4,.4,1) both}
@keyframes medaile{from{transform:scale(0) rotate(-90deg)}}
.velke-hvezdy{font-size:1.9rem;color:var(--gold);letter-spacing:6px;margin:4px 0 14px}
.velke-hvezdy span{display:inline-block;animation:medaile .8s cubic-bezier(.2,1.4,.4,1) both}
.konfety{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.konfety i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:pad linear forwards}
@keyframes pad{to{transform:translateY(110vh) rotate(720deg)}}

/* Diplom */
.diplom{background:#FFFDF6;color:var(--ink);max-width:820px;width:100%;padding:44px 48px 36px;text-align:center;position:relative;border-radius:6px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.diplom::before{content:"";position:absolute;inset:14px;border:3px double var(--gold3);border-radius:4px;pointer-events:none}
.diplom::after{content:"";position:absolute;inset:22px;border:1px solid rgba(185,128,42,.4);pointer-events:none}
.diplom .d-kicker{font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold3);font-weight:700}
.diplom h2{font-family:var(--serif);font-size:2.6rem;margin:6px 0 4px;color:var(--ink);font-weight:600}
.diplom .d-jmeno{font-family:var(--serif);font-size:2.1rem;font-style:italic;color:var(--blue);margin:18px 0 6px;border-bottom:1px solid #D9C9A3;display:inline-block;padding:0 30px 6px}
.diplom .d-text{max-width:560px;margin:10px auto;line-height:1.6}
.diplom .d-most{width:280px;margin:6px auto 0;display:block}
.diplom .d-pata{display:flex;justify-content:space-between;align-items:end;margin-top:26px;font-size:.85rem;gap:20px}
.diplom .d-podpis{text-align:center}
.diplom .d-podpis .linka{width:240px;border-top:1px solid var(--ink);margin:0 auto 6px}
.diplom .d-akce{display:flex;justify-content:center;gap:10px;margin-top:22px;position:relative;z-index:2}

footer{margin-top:36px;text-align:center;font-size:.72rem;color:#8EA3BE}
footer b{color:#C9D6E8;font-weight:600}

@media (max-width:640px){
  :root{--cw:2.2em}
  .uvod,.mise-panel{padding:24px 18px 20px}
  .sloupek{font-size:1.3rem;padding:10px}
  .diplom{padding:34px 22px}
  .diplom h2{font-size:1.9rem}
  .diplom .d-pata{flex-direction:column;align-items:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff!important}
  body::before{display:none}
  body > *:not(#zavojDiplom){display:none!important}
  #zavojDiplom{display:block!important;position:static;background:none;backdrop-filter:none;padding:0}
  .diplom{box-shadow:none;max-width:none}
  .d-akce{display:none!important}
}
</style>
</head>
<body class="rezim-intro">

<div class="wrap" id="aplikace">
  <header>
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBD991"/><stop offset="1" stop-color="#C98A27"/></linearGradient></defs>

let M = null; // {idx, ulohy, i, napoprve, vysledky:[]}
function startMise(idx){
  let ulohy, info;
  if (idx === HRA.mise.length){
    info = HRA.kolaudace;
    if (!S.kolSada || S.hotovo.includes(idx)) {
      S.kolSada = [];
      HRA.kolaudace.vyber.forEach((pocet, mi) => {
        const indexy = zamichej(HRA.mise[mi].ulohy.map((_,i)=>i)).slice(0,pocet).sort((a,b)=>a-b);
        indexy.forEach(ui => S.kolSada.push([mi,ui]));
      });
      uloz();
    }
    ulohy = S.kolSada.map(([mi,ui]) => HRA.mise[mi].ulohy[ui]);
  } else { info = HRA.mise[idx]; ulohy = info.ulohy; }
  M = { idx, info, ulohy, i:0, napoprve:0, vysledky:[] };
  modal(`<div class="kicker">${idx===HRA.mise.length?"Závěrečná mise":"Mise "+(idx+1)}</div><h2></h2><p></p><div class="akce" style="justify-content:center"><button class="btn-zlato" id="mOk">Jdeme na to</button></div>`,

  const ak = $("#akce"); ak.innerHTML = "";
  const pr = $("#prace"); pr.innerHTML = "";
  $("#kontext").textContent = u.kontext || u.zadani || "";
  const api = {
    zprava(typ, html){ zp.className = "zpetna on " + typ; zp.innerHTML = html; },
    tlacitko(text, fn, cls){ ak.innerHTML = ""; if (!text) return; const b = el("button", cls || "btn-zlato", text); b.onclick = fn; ak.appendChild(b); return b; },
    hotovo(napoprve){

      S.celkem++; if (napoprve) S.napoprve++; uloz();

    }

}

}

function cifPole(cls){ const i = el("input","cif" + (cls?" "+cls:"")); i.type="text"; i.inputMode="numeric"; i.maxLength=1; i.autocomplete="off"; i.setAttribute("aria-label","číslice"); return i; }
function cisloPole(){ const i = el("input","cislo"); i.type="text"; i.inputMode="numeric"; i.autocomplete="off"; i.setAttribute("aria-label","odpověď"); return i; }
const precti = v => { const t = String(v).replace(/[\s ]/g,""); return /^\d+$/.test(t) ? parseInt(t,10) : null; };
const pochvala = () => nahodny(HRA.pochvaly);
const enter = (inp, fn) => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); fn(); } });

// ---------- Úloha: dělení se zbytkem zpaměti ----------
function ulZbytek(u, pr, api){
  $("#kontext").textContent = "Vyděl zpaměti. Napiš výsledek a zbytek.";
  const q = Math.floor(u.a/u.b), r = u.a % u.b;
  const box = el("div","priklad-velky");
  box.appendChild(el("span",null,`${u.a} : ${u.b} =`));
  const iq = cisloPole(); box.appendChild(iq);
  box.appendChild(el("span","jednotka","zbytek"));
  const ir = cisloPole(); box.appendChild(ir);
  pr.appendChild(box);
  let pokus = 0;
  const kontrola = () => {
    const vq = precti(iq.value), vr = precti(ir.value);
    if (vq === null || vr === null) { api.zprava("info","Doplň výsledek i zbytek. Když nic nezbude, napiš 0."); return; }
    if (vq === q && vr === r) {
      iq.className = ir.className = "cislo dobre"; iq.disabled = ir.disabled = true;
      api.zprava("ok", `<b>${pochvala()}</b> ${u.a} : ${u.b} = ${q}, zbytek ${r}. Zkouška: ${q} · ${u.b} + ${r} = ${u.a}.`);
      api.hotovo(pokus === 0); return;
    }
    pokus++;
    iq.className = "cislo" + (vq !== q ? " spatne" : ""); ir.className = "cislo" + (vr !== r ? " spatne" : "");
    if (pokus === 1) {
      let rada;
      if (vr >= u.b) rada = `Zbytek musí být vždy menší než dělitel ${u.b}. Zkus větší výsledek.`;
      else if (vq * u.b > u.a) rada = `${vq} · ${u.b} = ${vq*u.b}, to je víc než ${u.a}. Zkus menší výsledek.`;
      else if (vq !== q) rada = `Najdi největší násobek čísla ${u.b}, který se vejde do ${u.a}.`;
      else rada = `Výsledek ${q} je správně. Zbytek spočítáš takto: ${u.a} − ${q} · ${u.b}.`;
      api.zprava("rada", `${nahodny(HRA.povzbuzeni)} <b>Nápověda:</b> ${rada}`);
    } else {
      iq.value = q; ir.value = r; iq.className = ir.className = "cislo dobre"; iq.disabled = ir.disabled = true;
      api.zprava("info", `<b>Řešení:</b> ${q} · ${u.b} = ${q*u.b}. Do ${u.a} chybí ještě ${r}, to je zbytek. ${u.a} : ${u.b} = ${q}, zbytek ${r}.`);
      api.hotovo(false);
    }
  };
  enter(iq, () => ir.focus()); enter(ir, kontrola);
  api.tlacitko("Zkontrolovat", kontrola);
  setTimeout(()=>iq.focus(), 50);
}

// ---------- Úloha: písemné násobení ----------
function ulNasobeni(u, pr, api){
  const aS = String(u.a), vys = u.a * u.b, vS = String(vys);
  const sloupce = aS.length + 1;
  // přenosy (pro nápovědu a odhalení)
  const cif = aS.split("").map(Number).reverse();
  const prenos = [0]; const zapis = [];
  cif.forEach((d,k) => { const t = d*u.b + prenos[k]; zapis[k] = t; prenos[k+1] = Math.floor(t/10); });
  const bezPrenosu = cif.map((d,k)=> k === cif.length-1 ? String(d*u.b) : String((d*u.b)%10)).reverse().join("");

  const s = el("div","sloupek");
  const pozn = el("div","pozn-pamet","pamatuji si"); s.appendChild(pozn);
  const rP = el("div","rad"); const pametPole = [];
  for (let c=0;c<sloupce;c++){
    const b = el("div","bunka mala");
    const k = sloupce-1-c; // řád, nad kterým okénko je
    if (k >= 1 && k <= aS.length-1) { const i = cifPole("pamet"); i.setAttribute("aria-label","zapamatované číslo nad řádem "+RADY[k]); b.appendChild(i); pametPole[k] = i; }
    rP.appendChild(b);
  }
  s.appendChild(rP);
  const rA = el("div","rad");
  for (let c=0;c<sloupce;c++){ const ix = c-1; rA.appendChild(el("div","bunka", ix>=0 ? aS[ix] : "")); }
  s.appendChild(rA);
  const rB = el("div","rad");
  for (let c=0;c<sloupce;c++) rB.appendChild(el("div","bunka", c===0 ? "·" : c===sloupce-1 ? String(u.b) : ""));
  s.appendChild(rB);
  s.appendChild(el("div","cara"));
  const rV = el("div","rad"); const pole = []; // pole[k] = vstup pro řád k
  for (let c=0;c<sloupce;c++){
    const k = sloupce-1-c; const b = el("div","bunka");
    if (k < vS.length) { const i = cifPole(); i.setAttribute("aria-label","výsledek, řád "+RADY[k]); b.appendChild(i); pole[k] = i; }
    rV.appendChild(b);
  }
  s.appendChild(rV);
  pr.appendChild(s);
  const kontextPuv = u.kontext ? u.kontext + " " : "";
  $("#kontext").textContent = kontextPuv + `Vypočítej písemně ${fmt(u.a)} · ${u.b}.`;

  pole.forEach((i,k) => {
    i.addEventListener("input", () => { i.value = i.value.replace(/\D/g,"").slice(-1); i.classList.remove("spatne"); if (i.value && pole[k+1]) pole[k+1].focus(); });
    i.addEventListener("keydown", e => { if (e.key==="Backspace" && !i.value && pole[k-1]) { pole[k-1].focus(); } if (e.key==="Enter") kontrola(); });
  });
  pametPole.forEach(i => { if (i) i.addEventListener("input", () => { i.value = i.value.replace(/\D/g,"").slice(-1); }); });

  let pokus = 0;
  function kontrola(){
    const zad = pole.map(i => i.value).reverse().join("");
    if (pole.some(i => i.value === "")) { api.zprava("info","Doplň všechna políčka výsledku. Začni vpravo, u jednotek."); return; }
    if (zad === vS) {
      pole.forEach(i => { i.className = "cif dobre"; i.disabled = true; });
      api.zprava("ok", `<b>${pochvala()}</b> ${fmt(u.a)} · ${u.b} = ${fmt(vys)}.`);
      api.hotovo(pokus === 0); return;
    }
    pokus++;
    // první chybný řád zprava
    let k = 0; while (k < vS.length && pole[k].value === vS[vS.length-1-k]) k++;
    if (pokus === 1) {
      pole[k].classList.add("spatne");
      const d = cif[k];
      let rada;
      if (zad === bezPrenosu) rada = "Zapomněl/a jsi přičítat čísla, která si pamatuješ z předchozího řádu. Zapiš si je do malých okének nahoře.";
      else if (k < cif.length) rada = `Podívej se na řád ${RADY[k]}: kolik je ${u.b} · ${d}` + (prenos[k] ? ` a kolik si pamatuješ z řádu ${RADY[k-1]}?` : "?");
      else rada = `Na začátek výsledku zapiš číslo, které si pamatuješ z řádu ${RADY[k-1]}.`;
      api.zprava("rada", `${nahodny(HRA.povzbuzeni)} <b>Nápověda:</b> ${rada}`);
      pole[k].focus();
    } else {
      // odhalení s postupem
      const kroky = [];
      cif.forEach((d,j) => {
        const t = zapis[j];
        let txt = `${RADY[j][0].toUpperCase()+RADY[j].slice(1)}: ${u.b} · ${d} = ${d*u.b}` + (prenos[j] ? ` + ${prenos[j]} = ${t}` : "");
        txt += j === cif.length-1 ? `, zapíšu ${t}.` : `, zapíšu ${t%10}` + (Math.floor(t/10) ? ` a ${Math.floor(t/10)} si pamatuji.` : ".");
        kroky.push(txt);
      });
      pole.forEach((i,j) => { setTimeout(() => { i.value = vS[vS.length-1-j]; i.className = "cif odhaleno"; i.disabled = true; }, j*260); });
      pametPole.forEach((i,j) => { if (i) { i.value = prenos[j] || ""; i.disabled = true; } });
      api.zprava("info", `<b>Řešení krok za krokem:</b><br>${kroky.join("<br>")}<br>Výsledek: <b>${fmt(vys)}</b>`);
      api.hotovo(false);
    }
  }
  api.tlacitko("Zkontrolovat", kontrola);
  setTimeout(()=>pole[0].focus(), 60);
}

// ---------- Úloha: písemné dělení krok za krokem ----------
function ulDeleni(u, pr, api){
  const aS = String(u.a), n = aS.length, dig = aS.split("").map(Number);
  // příprava kroků
  let konec = 0, cast = dig[0];
  while (cast < u.b && konec < n-1) { konec++; cast = cast*10 + dig[konec]; }
  const kroky = [];
  while (true) {
    const q = Math.floor(cast/u.b), r = cast - q*u.b;
    kroky.push({cast, konec, q, r});
    if (konec === n-1) break;
    konec++; cast = r*10 + dig[konec];
  }
  const podil = parseInt(kroky.map(k=>k.q).join(""),10), zbytek = kroky[kroky.length-1].r;
  $("#kontext").textContent = (u.kontext ? u.kontext + " " : "") + `Vyděl písemně ${fmt(u.a)} : ${u.b}.`;

  const s = el("div","sloupek");
  const obal = el("div","del-obal");
  const levy = el("div");
  const horni = el("div","rad"); const horniBunky = [];
  dig.forEach(d => { const b = el("div","bunka", String(d)); horni.appendChild(b); horniBunky.push(b); });
  levy.appendChild(horni);
  const prava = el("div","del-prava");
  prava.appendChild(el("span","zn",":")); prava.appendChild(el("span",null,String(u.b))); prava.appendChild(el("span","zn","="));
  const qPole = kroky.map(() => { const i = cifPole(); i.setAttribute("aria-label","číslice podílu"); i.disabled = true; prava.appendChild(i); return i; });
  const zbEl = el("span","zb",""); prava.appendChild(zbEl);
  obal.appendChild(levy); obal.appendChild(prava);
  s.appendChild(obal);
  pr.appendChild(s);
  const box = el("div"); box.style.width = "100%";
  const otazka = el("div","krok-otazka");
  const denik = el("ul","denik");
  pr.style.flexDirection = "column"; pr.style.alignItems = "center";
  pr.appendChild(otazka); pr.appendChild(denik);

  const radkyZbytku = [];
  function radekCisla(txt, kon){
    const r = el("div","rad dalsi");
    for (let c=0;c<n;c++){ const off = kon - c; const ch = (off >= 0 && off < txt.length) ? txt[txt.length-1-off] : ""; const b = el("div","bunka", ch); r.appendChild(b); }
    levy.appendChild(r); radkyZbytku.push(r); return r;
  }
  let krok = 0, chyby = 0, pokusKrok = 0;
  function zvyrazni(){
    horniBunky.forEach(b => b.classList.remove("zvyrazni"));
    radkyZbytku.forEach(r => r.querySelectorAll(".bunka").forEach(b => b.classList.remove("zvyrazni")));
    const k = kroky[krok];
    if (krok === 0) { for (let c=0;c<=k.konec;c++) horniBunky[c].classList.add("zvyrazni"); }
    else { const r = radkyZbytku[radkyZbytku.length-1]; r.querySelectorAll(".bunka").forEach(b => { if (b.textContent) b.classList.add("zvyrazni"); }); }
  }
  function zahajKrok(){
    const k = kroky[krok]; pokusKrok = 0;
    zvyrazni();
    let uvod = "";
    if (krok === 0 && k.konec > 0) uvod = `${u.b} se do ${dig[0]} nevejde, proto začínáme číslem ${k.cast}. `;
    otazka.innerHTML = `${uvod}Kolikrát se <b>${u.b}</b> vejde do <b>${k.cast}</b>?`;
    const i = qPole[krok]; i.disabled = false; i.value = ""; i.className = "cif"; i.focus();
    i.oninput = () => { i.value = i.value.replace(/\D/g,"").slice(-1); if (i.value !== "") over(i); };
  }
  function over(i){
    const k = kroky[krok], g = parseInt(i.value,10);
    if (g === k.q) { i.className = "cif dobre"; i.disabled = true; i.oninput = null; potvrdKrok(false); return; }
    pokusKrok++; chyby++;
    i.className = "cif spatne";
    if (pokusKrok === 1) {
      let rada;
      if (k.cast < u.b) rada = `${u.b} se do ${k.cast} nevejde ani jednou. Jakou číslici zapíšeš do podílu?`;
      else if (g*u.b > k.cast) rada = `To je moc. ${g} · ${u.b} = ${g*u.b}, a to je víc než ${k.cast}.`;
      else rada = `Vejde se tam víckrát. Zbylo by ${k.cast - g*u.b}, a to je víc než ${u.b}.`;
      api.zprava("rada", `<b>Nápověda:</b> ${rada}`);
      setTimeout(()=>{ i.value = ""; i.focus(); }, 650);
    } else {
      i.value = k.q; i.className = "cif odhaleno"; i.disabled = true; i.oninput = null;
      api.zprava("info", `Správně je <b>${k.q}</b>: ${k.q} · ${u.b} = ${k.q*u.b}` + (k.cast < u.b ? `. Když se dělitel nevejde, zapíšeme do podílu 0.` : `, to se do ${k.cast} ještě vejde.`));
      potvrdKrok(true);
    }
  }
  function potvrdKrok(odhaleno){
    const k = kroky[krok];
    if (!odhaleno) $("#zpetna").className = "zpetna";
    let zaznam = `${k.q} · ${u.b} = ${k.q*u.b}, ${k.cast} − ${k.q*u.b} = ${k.r}`;
    if (krok < kroky.length-1) {
      const dalsiK = kroky[krok+1];
      zaznam += `, připíšu ${dig[dalsiK.konec]} → ${dalsiK.cast}`;
      horniBunky[dalsiK.konec].classList.add("pouzito");
      const r = radekCisla(String(dalsiK.cast), dalsiK.konec);
      r.children[dalsiK.konec].classList.add("nova");
    } else {
      zaznam += k.r ? `. Zbytek je ${k.r}.` : ". Nic nezbylo.";
      radekCisla(String(k.r), k.konec);
    }
    denik.appendChild(el("li",null,zaznam));
    krok++;
    if (krok < kroky.length) setTimeout(zahajKrok, odhaleno ? 1400 : 450);
    else setTimeout(konecDeleni, 500);
  }
  function konecDeleni(){
    horniBunky.forEach(b => b.classList.remove("zvyrazni"));
    radkyZbytku.forEach(r => r.querySelectorAll(".bunka").forEach(b => b.classList.remove("zvyrazni")));
    zbEl.textContent = zbytek ? `zb. ${zbytek}` : "";
    if (!u.zkouska) { otazka.innerHTML = ""; uzavri(); return; }
    otazka.innerHTML = `Podíl je <b>${fmt(podil)}</b>${zbytek ? `, zbytek <b>${zbytek}</b>` : ""}. Teď zkouška: ověř, že vyjde ${fmt(u.a)}.`;
    const z = el("div","zkouska");
    z.appendChild(el("span","stit","Zkouška"));
    z.appendChild(el("span",null, `${fmt(podil)} · ${u.b}` + (zbytek ? ` + ${zbytek}` : "") + " ="));
    const iz = cisloPole(); z.appendChild(iz);
    pr.appendChild(z);
    let pz = 0;
    const kz = () => {
      const v = precti(iz.value);
      if (v === null) { api.zprava("info","Napiš výsledek zkoušky."); return; }
      if (v === u.a) { iz.className = "cislo dobre"; iz.disabled = true; uzavri(); return; }
      pz++; chyby++; iz.className = "cislo spatne";
      if (pz === 1) {
        const rada = (zbytek && v === podil*u.b) ? `Nezapomeň přičíst zbytek ${zbytek}!` : `Vynásob ${fmt(podil)} · ${u.b} písemně (do sešitu), ${zbytek ? "přičti zbytek " + zbytek + " " : ""}a podívej se, jestli vyjde ${fmt(u.a)}.`;
        api.zprava("rada", `<b>Nápověda:</b> ${rada}`); iz.focus();
      } else {
        iz.value = fmt(u.a); iz.className = "cislo dobre"; iz.disabled = true;
        api.zprava("info", `Zkouška: ${fmt(podil)} · ${u.b} = ${fmt(podil*u.b)}` + (zbytek ? `, plus zbytek ${zbytek} je ${fmt(u.a)}` : "") + `. Vyšlo původní číslo, dělení je správně.`);
        uzavri(true);
      }
    };
    enter(iz, kz);
    api.tlacitko("Zkontrolovat zkoušku", kz);
    setTimeout(()=>iz.focus(), 60);
  }
  function uzavri(poOdhaleni){
    api.tlacitko(null);
    const t = `${fmt(u.a)} : ${u.b} = ${fmt(podil)}` + (zbytek ? `, zbytek ${zbytek}` : "");
    if (!poOdhaleni) api.zprava(chyby ? "info" : "ok", chyby ? `<b>Hotovo.</b> ${t}. Příště to půjde ještě lépe!` : `<b>${pochvala()}</b> ${t}. Zkouška sedí!`);
    api.hotovo(chyby === 0);
  }
  api.tlacitko(null);
  setTimeout(zahajKrok, 200);
}

// ---------- Úloha: výběr z možností ----------
function ulVolba(u, pr, api){
  const v = el("div","volby"); let pokus = 0;
  zamichej(u.moznosti).forEach(t => {
    const b = el("button","volba",t);
    b.onclick = () => {

        v.querySelectorAll("button").forEach(x => x.disabled = true); b.classList.add("dobre");
        api.zprava("ok", `<b>${pochvala()}</b> ${u.vysvetleni}`); api.hotovo(pokus === 0); return;
      }
      pokus++; b.classList.add("spatne"); b.disabled = true;
      if (pokus === 1) api.zprava("rada", `${nahodny(HRA.povzbuzeni)} <b>Nápověda:</b> ${u.napoveda}`);
      else {
        v.querySelectorAll("button").forEach(x => { x.disabled = true; if (x.textContent === u.spravne) x.classList.add("dobre"); });
        api.zprava("info", `<b>Řešení:</b> ${u.vysvetleni}`); api.hotovo(false);
      }
    };

  });

}

// ---------- Úloha: odpověď číslem ----------
function ulCislo(u, pr, api){
  const box = el("div","priklad-velky");
  const i = cisloPole(); box.appendChild(i);
  if (u.jednotka) box.appendChild(el("span","jednotka",u.jednotka));
  pr.appendChild(box);
  let pokus = 0;
  const kontrola = () => {
    const v = precti(i.value);
    if (v === null) { api.zprava("info","Napiš odpověď číslem."); return; }
    if (v === u.spravne) { i.className = "cislo dobre"; i.disabled = true; api.zprava("ok", `<b>${pochvala()}</b> ${u.vysvetleni}`); api.hotovo(pokus === 0); return; }
    pokus++; i.className = "cislo spatne";
    if (pokus === 1) {
      const cil = u.chyby && u.chyby[String(v)];
      api.zprava("rada", `${nahodny(HRA.povzbuzeni)} <b>Nápověda:</b> ${cil || u.napoveda}`); i.focus(); i.select();
    } else {
      i.value = fmt(u.spravne); i.className = "cislo dobre"; i.disabled = true;
      api.zprava("info", `<b>Řešení:</b> ${u.vysvetleni}`); api.hotovo(false);
    }
  };
  enter(i, kontrola);
  api.tlacitko("Zkontrolovat", kontrola);
  setTimeout(()=>i.focus(), 60);
}

    <p class="d-text" style="font-size:.85rem;color:var(--muted)" id="dStat"></p>
    <div class="d-pata"><div>Datum: <b id="dDatum"></b></div>
      <div class="d-podpis"><div class="linka"></div><div id="dAutor"></div></div></div>
    <div class="d-akce"><button class="btn-zlato" id="dTisk">Vytisknout diplom</button><button class="btn-modra" id="dZavri">Zavřít</button></div>`;
  d.querySelector("h2").textContent = HRA.diplom.titul;
  $("#dJmeno").textContent = S.jmeno;
  $("#dText").textContent = HRA.diplom.text;
  $("#dStat").textContent = `${HRA.nazev} · ${HRA.rocnik} · napoprvé správně ${S.napoprve} z ${S.celkem} úloh`;
  $("#dDatum").textContent = S.datum || new Date().toLocaleDateString("cs-CZ");
  $("#dAutor").textContent = HRA.autor;
  $("#dTisk").onclick = () => window.print();
  $("#dZavri").onclick = () => $("#zavojDiplom").classList.remove("on");
  $("#zavojDiplom").classList.add("on");
}

// ---------- Ovládání ----------
function pismo(z){ S.pismo = Math.min(26, Math.max(16, (S.pismo||19) + z)); document.documentElement.style.setProperty("--fs", S.pismo + "px"); uloz(); }
function init(){
  nacti(); pripravScenu();
  document.documentElement.style.setProperty("--fs", (S.pismo||19) + "px");
  $("#uvodNadpis").textContent = "Most pro Rovinku";
  $("#uvodText").textContent = HRA.uvod;
  $("#podpisUvod").textContent = HRA.autor;
  $("#autorPata").textContent = HRA.autor;
  $("#pismoMensi").onclick = () => pismo(-1);
  $("#pismoVetsi").onclick = () => pismo(1);
  $("#restart").onclick = () => { if (confirm("Opravdu chceš začít celou stavbu znovu? Postup se smaže.")) { const p = S.pismo; S = vychozi(); S.pismo = p; uloz(); M = null; zavriModal(); $("#zavojDiplom").classList.remove("on"); hlavicka(); $("#jmenoVstup").value = ""; ukaz("obrUvod","intro"); vykresliScenu(false); } };
  $("#zpet").onclick = () => { if (confirm("Opravdu chceš misi opustit? Rozpracovaná mise se začne znovu.")) hub(false); };
  $("#otevritDiplom").onclick = diplom;
  const start = () => { const j = $("#jmenoVstup").value.trim(); if (!j) { $("#jmenoVstup").focus(); $("#jmenoVstup").placeholder = "Nejdřív napiš své jméno"; return; } S.jmeno = j; uloz(); hub(false); };
  $("#start").onclick = start; enter($("#jmenoVstup"), start);
  if (S.jmeno) hub(false); else { ukaz("obrUvod","intro"); vykresliScenu(false); }
}
init();
})();
</script>
